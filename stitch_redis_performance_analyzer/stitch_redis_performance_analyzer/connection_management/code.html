            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        ::-webkit-scrollbar {

            background: #334155;

<body class="bg-[#0F172A] text-[#fbdbd7] font-body-md h-screen w-screen overflow-hidden flex flex-col antialiased selection:bg-[#dc2626] selection:text-white">
<!-- Window Chrome -->
<div class="h-10 bg-[#1E293B] border-b border-[#334155] flex items-center justify-between px-4 shrink-0 drag-region">
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-red-500 hover:bg-red-600 transition-colors cursor-pointer"></div>
<div class="w-3 h-3 rounded-full bg-yellow-500 hover:bg-yellow-600 transition-colors cursor-pointer"></div>
<div class="w-3 h-3 rounded-full bg-green-500 hover:bg-green-600 transition-colors cursor-pointer"></div>
</div>
<div class="font-h2 text-h2 text-[#DC2626] tracking-tight uppercase flex items-center gap-2 select-none">
<span class="material-symbols-outlined text-[18px]">database</span>
            Redis Insight
        </div>
<div class="w-[52px]"></div> <!-- Spacer for balance -->
</div>
<!-- Main Container -->
<div class="flex h-[calc(100vh-40px)] w-full">
<!-- Left Pane: Saved Connections -->
<div class="w-[300px] bg-[#1E293B] border-r border-[#334155] flex flex-col shrink-0">
<div class="p-4 border-b border-[#334155] flex justify-between items-center">
<h2 class="font-mono-md text-mono-md text-slate-400 uppercase tracking-widest">Saved Connections</h2>
<button class="text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
<div class="flex-1 overflow-y-auto p-2 space-y-1">
<!-- Connection Item: Online -->
<div class="flex items-center gap-3 p-3 rounded bg-slate-700/50 border border-[#334155] cursor-pointer group hover:border-[#475569]">
<div class="relative">
<span class="material-symbols-outlined text-slate-300">dns</span>
<div class="absolute -bottom-1 -right-1 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-[#1E293B]"></div>
<div class="absolute -bottom-1 -right-1 w-2.5 h-2.5 bg-green-500 rounded-full animate-ping opacity-75"></div>
</div>
<div class="flex-1 min-w-0">
<div class="font-body-md text-body-md text-white truncate">Production Main</div>
<div class="font-mono-sm text-mono-sm text-slate-400 truncate">10.0.1.45:6379</div>
</div>
<span class="material-symbols-outlined text-[16px] text-slate-500 group-hover:text-white transition-colors opacity-0 group-hover:opacity-100">more_vert</span>
</div>
<!-- Connection Item: Offline -->
<div class="flex items-center gap-3 p-3 rounded border border-transparent cursor-pointer group hover:bg-slate-700/30">
<div class="relative">
<span class="material-symbols-outlined text-slate-500">dns</span>
<div class="absolute -bottom-1 -right-1 w-2.5 h-2.5 bg-slate-500 rounded-full border-2 border-[#1E293B]"></div>
</div>
<div class="flex-1 min-w-0">
<div class="font-body-md text-body-md text-slate-300 truncate">Staging Cluster</div>
<div class="font-mono-sm text-mono-sm text-slate-500 truncate">redis-staging.internal</div>
</div>
<span class="material-symbols-outlined text-[16px] text-slate-500 group-hover:text-white transition-colors opacity-0 group-hover:opacity-100">more_vert</span>
</div>
<!-- Connection Item: Warning -->
<div class="flex items-center gap-3 p-3 rounded border border-transparent cursor-pointer group hover:bg-slate-700/30">
<div class="relative">
<span class="material-symbols-outlined text-slate-500">hub</span>
<div class="absolute -bottom-1 -right-1 w-2.5 h-2.5 bg-yellow-500 rounded-full border-2 border-[#1E293B]"></div>
</div>
<div class="flex-1 min-w-0">
<div class="font-body-md text-body-md text-slate-300 truncate">Local Dev</div>
<div class="font-mono-sm text-mono-sm text-slate-500 truncate">127.0.0.1:6379</div>
</div>
<span class="material-symbols-outlined text-[16px] text-slate-500 group-hover:text-white transition-colors opacity-0 group-hover:opacity-100">more_vert</span>
</div>
</div>
<div class="p-4 border-t border-[#334155] text-center">
<span class="font-body-sm text-body-sm text-slate-500">v7.2.4 Desktop</span>
</div>
</div>
<!-- Main Content Area: Setup -->
<div class="flex-1 flex flex-col bg-[#0F172A] overflow-hidden">
<!-- Top Header -->
<div class="h-16 px-8 flex items-center border-b border-[#334155] shrink-0">
<h1 class="font-h1 text-h1 text-white">New Connection</h1>
</div>
<div class="flex-1 overflow-y-auto p-8">
<div class="max-w-3xl mx-auto space-y-8">
<!-- Connection Type Tabs -->
<div class="bg-[#1E293B] p-1 rounded-lg border border-[#334155] inline-flex">
<button class="px-6 py-2 rounded bg-slate-700/50 text-white font-mono-md text-mono-md border border-[#334155] shadow-sm">Standalone</button>
<button class="px-6 py-2 rounded text-slate-400 font-mono-md text-mono-md hover:text-white transition-colors">Sentinel</button>
<button class="px-6 py-2 rounded text-slate-400 font-mono-md text-mono-md hover:text-white transition-colors">Cluster</button>
</div>
<!-- Setup Form -->
<div class="bg-[#1E293B] border border-[#334155] rounded-lg p-6 space-y-6 shadow-sm">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Name -->
<div class="space-y-2 md:col-span-2">
<label class="block font-mono-sm text-mono-sm text-slate-400 uppercase tracking-wider">Connection Name</label>
<input class="w-full bg-[#0F172A] border border-[#334155] rounded px-4 py-2 font-mono-md text-mono-md text-white placeholder-slate-600 transition-all duration-200" placeholder="e.g., Local Dev Server" type="text"/>
</div>
<!-- Host -->
<div class="space-y-2">
<label class="block font-mono-sm text-mono-sm text-slate-400 uppercase tracking-wider">Host</label>
<input class="w-full bg-[#0F172A] border border-[#334155] rounded px-4 py-2 font-mono-md text-mono-md text-white placeholder-slate-600 transition-all duration-200" type="text" value="127.0.0.1"/>
</div>
<!-- Port -->
<div class="space-y-2">
<label class="block font-mono-sm text-mono-sm text-slate-400 uppercase tracking-wider">Port</label>
<input class="w-full bg-[#0F172A] border border-[#334155] rounded px-4 py-2 font-mono-md text-mono-md text-white placeholder-slate-600 transition-all duration-200" type="text" value="6379"/>
</div>
<!-- Username -->
<div class="space-y-2">
<label class="block font-mono-sm text-mono-sm text-slate-400 uppercase tracking-wider">Username <span class="text-slate-600 lowercase tracking-normal">(Optional)</span></label>
<input class="w-full bg-[#0F172A] border border-[#334155] rounded px-4 py-2 font-mono-md text-mono-md text-white placeholder-slate-600 transition-all duration-200" placeholder="default" type="text"/>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block font-mono-sm text-mono-sm text-slate-400 uppercase tracking-wider">Password</label>
<div class="relative">
<input class="w-full bg-[#0F172A] border border-[#334155] rounded px-4 py-2 font-mono-md text-mono-md text-white placeholder-slate-600 transition-all duration-200 pr-10" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Advanced Settings Accordion -->
<div class="border-t border-[#334155] pt-6 mt-6">
<button class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors font-mono-sm text-mono-sm uppercase tracking-wider w-full">
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
                                Advanced Settings
                            </button>
</div>
</div>

<div class="flex items-center justify-end gap-4 pt-4">
<button class="px-6 py-2 rounded bg-transparent border border-[#334155] text-white font-mono-md text-mono-md hover:bg-slate-800 transition-colors">Test Connection</button>
<button class="px-6 py-2 rounded bg-[#DC2626] text-white font-mono-md text-mono-md hover:bg-red-700 transition-colors shadow-[0_0_15px_rgba(220,38,38,0.3)]">Connect &amp; Save</button>
</div>
</div>
</div>
